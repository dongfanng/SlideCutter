<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlideCutter · PPT 素材切片</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>SlideCutter</h1>
      <span class="sub">本地 PPT 素材智能切片 · 图片全程在本机处理</span>
      <a class="github" href="https://github.com/dongfanng/SlideCutter" target="_blank" rel="noopener" aria-label="GitHub 仓库">
        <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>
    </header>

    <main class="layout">
      <section class="preview-col">
        <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="拖入图片或点击选择">
          <div class="dz-inner">
            <div class="dz-icon">＋</div>
            <p class="dz-title">拖入图片到这里，或点击选择文件</p>
            <p class="dz-hint">支持 PNG / JPG / GIF / WebP · 白底整图素材</p>
          </div>
        </div>
        <div id="stage" class="stage" hidden>
          <canvas id="canvas"></canvas>
        </div>
        <div id="status" class="status"></div>
      </section>

      <aside class="side-col">
        <section class="card">
          <h2>检测参数</h2>
          <div class="field">
            <label for="bg">背景色</label>
            <input type="color" id="bg" value="#ffffff">
          </div>
          <div class="field">
            <label for="tolerance">容差 <span id="toleranceVal">30</span></label>
            <input type="range" id="tolerance" min="0" max="120" value="30">
          </div>
          <div class="field">
            <label for="minSize">最小尺寸 <span id="minSizeVal">16</span>px</label>
            <input type="range" id="minSize" min="1" max="120" value="16">
          </div>
          <div class="field">
            <label for="connectivity">连通邻域</label>
            <select id="connectivity">
              <option value="8" selected>8 邻域（默认）</option>
              <option value="4">4 邻域</option>
            </select>
          </div>
          <div class="field checkbox">
            <label for="peelBlack"><input type="checkbox" id="peelBlack"> 剥离黑色边缘</label>
          </div>
          <div class="field checkbox">
            <label for="preserveWhite"><input type="checkbox" id="preserveWhite"> 保留白色像素（不去白底）</label>
          </div>
          <div class="field checkbox">
            <label for="filterText"><input type="checkbox" id="filterText"> 过滤文字内容</label>
          </div>
          <div class="field">
            <label for="textFillRatio">文字填充率 <span id="textFillRatioVal">0.35</span></label>
            <input type="range" id="textFillRatio" min="0.05" max="0.9" step="0.05" value="0.35">
          </div>
          <div class="field">
            <label for="textMaxHeight">文字最大高度 <span id="textMaxHeightVal">24</span>px</label>
            <input type="range" id="textMaxHeight" min="8" max="80" value="24">
          </div>
        </section>

        <section class="card">
          <h2>操作</h2>
          <div class="btnrow">
            <button id="btnReset" class="btn">重置参数</button>
            <button id="btnExport" class="btn primary" disabled>导出 ZIP</button>
            <button id="btnPpt" class="btn primary" disabled>下载 PPT</button>
          </div>
          <div class="btnrow">
            <button id="btnMerge" class="btn" disabled>合并选中</button>
            <button id="btnExclude" class="btn" disabled>排除选中</button>
          </div>
          <p class="hint">在画布点击切割框选择；Ctrl / Shift / ⌘ 多选。<br>合并：把多个选中框并为一个元素；排除：不导出该元素。<br>下载 PPT 在浏览器本地生成，无需安装任何环境。</p>
        </section>

        <section class="card">
          <h2>元素列表 <span id="count" class="count"></span></h2>
          <ul id="list" class="list"></ul>
        </section>
      </aside>
    </main>
  </div>

  <input type="file" id="fileInput" accept="image/*" hidden>
  <script src="/web/vendor/jszip.min.js"></script>
  <script src="/web/vendor/pptxgen.min.js"></script>
  <script type="module" src="/web/main.js"></script>
</body>
</html>
